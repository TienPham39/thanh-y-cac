name: Build and deploy DirectAdmin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: directadmin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: local-ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, fileinfo
      - name: Check PHP syntax
        run: find directadmin scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP API integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: local-ci-test-password
        run: npm run test:php
      - name: Frontend tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build DirectAdmin site
        run: npm run build:directadmin
      - name: Check deploy files
        run: |
          test -f dist/index.html
          test -f dist/chi-tiet-trang-phuc/index.html
          test -f dist/.htaccess
          test -f dist/api/index.php
          test -f dist/api/.htaccess
          test -f dist/images/banner-1.webp
          test "$(cat dist/api/.db-password)" = CHANGE_ME
      - uses: actions/upload-artifact@v4
        with:
          name: directadmin-dist
          path: |
            dist/
            !dist/api/.db-password
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: directadmin-dist
          path: dist/
      - name: Update hosting database before uploading
        if: vars.DIRECTADMIN_MIGRATION_MODE == 'ssh'
        env:
          SSH_HOST: ${{ secrets.DIRECTADMIN_SSH_HOST }}
          SSH_USER: ${{ secrets.DIRECTADMIN_SSH_USER }}
          SSH_KEY: ${{ secrets.DIRECTADMIN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DIRECTADMIN_SSH_KNOWN_HOSTS }}
          API_PATH: ${{ vars.DIRECTADMIN_API_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Configure DIRECTADMIN_SSH_HOST}"
          : "${SSH_USER:?Configure DIRECTADMIN_SSH_USER}"
          : "${SSH_KEY:?Configure DIRECTADMIN_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Configure verified DIRECTADMIN_SSH_KNOWN_HOSTS}"
          : "${API_PATH:?Configure absolute DIRECTADMIN_API_PATH}"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]
          [[ "$API_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$API_PATH" != *..* ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote_dir=$(ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'mktemp -d /tmp/tyc-migrate.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/tyc-migrate\.[A-Za-z0-9]+$ ]]
          trap 'ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "rm -rf -- $remote_dir"; rm -f ~/.ssh/id_ed25519' EXIT
          scp -o BatchMode=yes scripts/migrate-hosting.php "$SSH_USER@$SSH_HOST:$remote_dir/"
          scp -o BatchMode=yes -r directadmin/migrations "$SSH_USER@$SSH_HOST:$remote_dir/"
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "php '$remote_dir/migrate-hosting.php' '$API_PATH'"
      - name: Upload website through DirectAdmin API
        # Shared hosting uses the phpMyAdmin migration bundle; SSH is opt-in.
        if: success()
        env:
          DIRECTADMIN_FTP_HOST: ${{ secrets.DIRECTADMIN_FTP_HOST }}
          DIRECTADMIN_FTP_USER: ${{ secrets.DIRECTADMIN_FTP_USER }}
          DIRECTADMIN_FTP_PASSWORD: ${{ secrets.DIRECTADMIN_FTP_PASSWORD }}
          DIRECTADMIN_FTP_PATH: ${{ vars.DIRECTADMIN_FTP_PATH }}
        run: bash scripts/deploy-directadmin.sh
      - name: Check live website
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 https://thanhycac.com/api/ready
          curl --fail --silent --show-error --head https://thanhycac.com/images/banner-1.webp > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://thanhycac.com/api/.db-password)" = 403
