name: thanh-y-cac
x-app-environment: &app-environment
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
  DB_USER: ${MYSQL_USER:?Set MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  TYC_PRIVATE_DIR: /var/www/tyc-private
services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    environment: *app-environment
    volumes:
      - ./tyc-private:/var/www/tyc-private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/ready') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
volumes:
  mysql_data:
